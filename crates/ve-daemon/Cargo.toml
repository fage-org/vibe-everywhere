[package]
name = "ve-daemon"
version = "0.1.0"
edition = "2021"
description = "Vibe Everywhere Daemon - Local agent runner and WebSocket bridge"

[dependencies]
ve-shared = { path = "../ve-shared" }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = "1"

# Async trait
async-trait = "0.1"

# CLI discovery
which = "7"

# Time and UUID
chrono = { workspace = true }
uuid = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }
futures-util = "0.3"

# HTTP client for pairing
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Random for backoff jitter
rand = { workspace = true }

# Configuration
config = "0.14"
dotenvy = "0.15"
dirs = "6"

[dev-dependencies]
tempfile = "3"
